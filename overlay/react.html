<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>React</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-ui);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      user-select: none;
    }
    #title {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--head);
      text-shadow: 0 0 8px rgba(28, 158, 255, .5);
      text-align: center;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #title.empty {
      color: var(--muted);
      text-shadow: none;
    }
    #row {
      display: flex;
      gap: 8px;
    }
    .react-btn {
      font-size: 34px;
      line-height: 1;
      width: 52px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(28, 158, 255, .14), rgba(10, 95, 176, .14));
      border: 1px solid var(--line);
      clip-path: var(--cut-sm);
      transition: filter .12s, transform .08s, box-shadow .12s;
    }
    .react-btn:hover {
      filter: brightness(1.15);
      box-shadow: var(--glow);
      border-color: var(--accent);
    }
    .react-btn:active { transform: translateY(1px); }
    body.disabled .react-btn {
      filter: grayscale(.85) brightness(.55);
      cursor: default;
      box-shadow: none;
      pointer-events: none;
    }
  </style>
</head>
<body class="lc-bg disabled">
  <div id="title" class="empty">No one to react to yet</div>
  <div id="row">
    <div class="react-btn" data-emoji="💀">💀</div>
    <div class="react-btn" data-emoji="😂">😂</div>
    <div class="react-btn" data-emoji="🔥">🔥</div>
    <div class="react-btn" data-emoji="👎">👎</div>
    <div class="react-btn" data-emoji="🐐">🐐</div>
  </div>
  <script src="react.js"></script>
</body>
</html>
