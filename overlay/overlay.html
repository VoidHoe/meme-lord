<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
      font-family: sans-serif;
    }
    #drop-container {
      position: absolute;
      max-width: 480px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #drop-container img,
    #drop-container video {
      max-width: 480px;
      max-height: 320px;
      border-radius: 12px;
      object-fit: contain;
    }
    #drop-container iframe {
      width: 480px;
      height: 270px;
      border: none;
      border-radius: 12px;
    }
    .emoji-display {
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    }
    #queue-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      display: none;
    }
    /* ── Effects ───────────────────────────────────────────────── */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.92); }
    }
    .fx-spin { animation: spin 0.8s linear; }
    /* fade-in/out are applied via container inline style for precise timing */

    .drop-caption {
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      max-width: 480px;
      text-align: center;
      word-break: break-word;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="drop-container" style="display:none"></div>
  <div id="queue-badge"></div>
  <script src="overlay.js"></script>
</body>
</html>
