<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
      font-family: sans-serif;
    }
    #drop-container {
      position: absolute;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #drop-container img,
    #drop-container video {
      max-width: 100%;
      max-height: 360px;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 0 22px rgba(28,158,255,.28), 0 8px 30px rgba(0,0,0,.5);
    }
    #drop-container iframe {
      width: 480px;
      height: 270px;
      border: none;
      border-radius: 12px;
    }
    #drop-container .embed-tiktok {
      width: 325px;
      height: 580px;
    }
    #drop-container .embed-twitter {
      width: 480px;
      height: 360px;
    }
    .emoji-display {
      font-size: 120px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    }
    #queue-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
      display: none;
    }
    /* ── Effects ───────────────────────────────────────────────── */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.92); }
    }
    /* fade-in/out are applied via container inline style for precise timing */

    /* Animation layers wrap the media so transforms can stack (emphasis ⊃ entrance ⊃ media) */
    .fx-layer { display: flex; align-items: center; justify-content: center; perspective: 700px; }

    /* ── Entrance (one-shot transform) ── */
    .fx-spin   { animation: spin 0.8s linear; }
    @keyframes fx-drop   { 0%{transform:translateY(-160%)} 60%{transform:translateY(0)} 72%{transform:translateY(-22%)} 84%{transform:translateY(0)} 92%{transform:translateY(-8%)} 100%{transform:translateY(0)} }
    @keyframes fx-slide  { 0%{transform:translateX(-180%);opacity:0} 100%{transform:translateX(0);opacity:1} }
    @keyframes fx-zoom   { 0%{transform:scale(2.6);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes fx-flip   { 0%{transform:rotateY(90deg);opacity:0} 100%{transform:rotateY(0);opacity:1} }
    @keyframes fx-glitch { 0%,100%{transform:translate(0);filter:none} 20%{transform:translate(-6px,2px);filter:hue-rotate(90deg)} 40%{transform:translate(6px,-2px);filter:hue-rotate(-90deg)} 60%{transform:translate(-4px,-1px)} 80%{transform:translate(4px,1px)} }
    @keyframes fx-slam   { 0%{transform:scale(2.8);opacity:0} 50%{transform:scale(1);opacity:1} 60%{transform:translate(-7px,0)} 72%{transform:translate(7px,0)} 84%{transform:translate(-4px,0)} 100%{transform:translate(0)} }
    @keyframes fx-bounce { 0%{transform:translateY(-140%);opacity:0} 55%{transform:translateY(0);opacity:1} 72%{transform:translateY(-24%)} 86%{transform:translateY(0)} 94%{transform:translateY(-8%)} 100%{transform:translateY(0)} }
    .fx-drop   { animation: fx-drop .9s cubic-bezier(.2,.7,.3,1); }
    .fx-slide  { animation: fx-slide .55s cubic-bezier(.2,.9,.3,1); }
    .fx-zoom   { animation: fx-zoom .5s cubic-bezier(.2,1.5,.4,1); }
    .fx-flip   { animation: fx-flip .7s ease; }
    .fx-glitch { animation: fx-glitch .55s steps(30); }
    .fx-slam   { animation: fx-slam .75s ease; }
    .fx-bounce { animation: fx-bounce .9s cubic-bezier(.25,.8,.3,1); }

    /* ── Emphasis (looping transform) ── */
    @keyframes fx-shake  { 0%,100%{transform:translate(0) rotate(0)} 15%{transform:translate(-6px,0) rotate(-5deg)} 30%{transform:translate(6px,0) rotate(5deg)} 45%{transform:translate(-5px,0) rotate(-4deg)} 60%{transform:translate(5px,0) rotate(4deg)} 75%{transform:translate(-3px,0) rotate(-2deg)} }
    @keyframes fx-pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.16)} }
    @keyframes fx-wobble { 0%,100%{transform:rotate(0) skewX(0)} 25%{transform:rotate(-7deg) skewX(6deg)} 50%{transform:rotate(5deg) skewX(-5deg)} 75%{transform:rotate(-3deg) skewX(2deg)} }
    @keyframes fx-spinloop { to{transform:rotate(360deg)} }
    @keyframes fx-float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .fx-shake     { animation: fx-shake .5s ease-in-out infinite; }
    .fx-pulse     { animation: fx-pulse 1s ease-in-out infinite; }
    .fx-wobble    { animation: fx-wobble 1.1s ease-in-out infinite; }
    .fx-spin-loop { animation: fx-spinloop 2.5s linear infinite; }
    .fx-float     { animation: fx-float 2s ease-in-out infinite; }

    /* ── Filters (on the media element) ── */
    @keyframes fx-rainbow { from{filter:hue-rotate(0deg) saturate(1.5)} to{filter:hue-rotate(360deg) saturate(1.5)} }
    @keyframes fx-glow    { 0%,100%{filter:drop-shadow(0 0 3px #1c9eff)} 50%{filter:drop-shadow(0 0 16px #1c9eff) drop-shadow(0 0 30px #2eb0ff)} }
    @keyframes fx-flash   { 0%{filter:brightness(8)} 100%{filter:brightness(1)} }
    .fx-rainbow { animation: fx-rainbow 2s linear infinite; }
    .fx-glow    { animation: fx-glow 1.4s ease-in-out infinite; }
    .fx-flash   { animation: fx-flash .5s ease; }

    /* Classic Impact meme: white outlined text laid over media, top + bottom. */
    .impact-frame {
      position: relative;
      line-height: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 22px rgba(28,158,255,.28), 0 8px 30px rgba(0,0,0,.5);
    }
    .impact-frame img,
    .impact-frame video {
      display: block;
      border-radius: 0;
      box-shadow: none;
    }
    .impact-frame.caption-card {
      background: #fff;
    }
    .impact-card-text {
      color: #050607;
      background: #fff;
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 30px;
      line-height: 1.08;
      text-align: center;
      text-transform: uppercase;
      padding: 12px 16px 10px;
      box-sizing: border-box;
      word-break: break-word;
    }
    .impact-text {
      position: absolute;
      left: 0; right: 0;
      text-align: center;
      font-family: 'Impact', 'Arial Narrow Bold', 'Arial Black', sans-serif;
      font-size: 34px;
      font-weight: 400;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.05;
      padding: 0 10px;
      box-sizing: border-box;
      word-break: break-word;
      -webkit-text-stroke: 2px #000;
      text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000;
    }
    .impact-top    { top: 10px; }
    .impact-bottom { bottom: 10px; }

    .drop-caption {
      font-family: var(--font-ui);
      background: rgba(7,13,21,.82);
      border: 1px solid var(--line-soft);
      color: var(--head);
      box-shadow: var(--glow-soft);
      text-shadow: 0 0 10px rgba(28,158,255,.5);
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 8px 16px;
      border-radius: 8px;
      max-width: 480px;
      text-align: center;
      word-break: break-word;
      margin-top: 4px;
    }

    .chase-timer {
      position: fixed;
      min-width: 260px;
      padding: 10px 22px 12px;
      border-radius: 0;
      background: #000;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .55);
      color: #fff;
      text-align: center;
      transform-origin: center;
      animation: chasePop .16s ease-out;
    }
    .chase-timer.done {
      animation: chaseFinish .28s ease forwards;
    }
    .chase-kicker {
      display: none;
    }
    .chase-clock {
      margin-top: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 58px;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      text-shadow: none;
    }
    .chase-bar {
      display: none;
    }
    .chase-bar i {
      display: block;
      width: 100%;
      height: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      background: linear-gradient(90deg, #ff2e5b, #ffcf3f);
      box-shadow: 0 0 15px rgba(255, 207, 63, .62);
    }
    .chase-music-frame {
      position: fixed;
      left: -20px;
      top: -20px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }
    @keyframes chasePop {
      0% { opacity: 0; transform: scale(.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes chaseFinish {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(.98); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="drop-container" style="display:none"></div>
  <div id="queue-badge"></div>
  <script src="overlay.js"></script>
</body>
</html>
