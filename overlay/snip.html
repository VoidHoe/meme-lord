<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: #000; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: fill; -webkit-user-drag: none; pointer-events: none; }
    #dim  { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #hint {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 3;
      font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .8px;
      color: #dcefff; background: rgba(7,13,21,.85); border: 1px solid rgba(28,158,255,.45);
      padding: 9px 18px; box-shadow: 0 0 20px rgba(28,158,255,.4);
      clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    }
    #size {
      position: fixed; z-index: 3; display: none; pointer-events: none;
      font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; color: #fff;
      background: rgba(28,158,255,.92); padding: 2px 8px; border-radius: 3px;
    }
  </style>
</head>
<body>
  <img id="shot" />
  <canvas id="dim"></canvas>
  <div id="hint">◆ Drag to snip &nbsp;·&nbsp; Esc to cancel</div>
  <div id="size"></div>
  <script src="snip.js"></script>
</body>
</html>
