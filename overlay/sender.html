<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MemeDrop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12111a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Titlebar ── */
    #titlebar {
      background: linear-gradient(135deg, #1e1a3a 0%, #16213e 100%);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(167,139,250,0.12);
      flex-shrink: 0;
    }
    .title-left { display: flex; align-items: baseline; gap: 8px; }
    .title-text { font-weight: 700; font-size: 14px; color: #c4b5fd; letter-spacing: 0.3px; }
    .title-hint { font-size: 10px; color: rgba(167,139,250,0.3); }
    #close-btn {
      -webkit-app-region: no-drag;
      background: none; border: none; color: #3a3565;
      font-size: 15px; cursor: pointer; padding: 3px 8px;
      border-radius: 5px; transition: all 0.15s;
    }
    #close-btn:hover { background: rgba(248,113,113,0.12); color: #f87171; }

    /* ── Main container (slide host) ── */
    #main { flex: 1; overflow: hidden; position: relative; }

    /* ── Drop view ── */
    #drop-view {
      position: absolute; inset: 0;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #drop-view.slide-out { transform: translateX(-100%); }

    /* ── GIF view ── */
    #gif-view {
      position: absolute; inset: 0;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      background: #12111a;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #gif-view.slide-in { transform: translateX(0); }

    /* ── Field labels ── */
    .field-label {
      font-size: 10px; font-weight: 600;
      color: rgba(167,139,250,0.45);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 5px;
    }
    .field-label .opt { opacity: 0.4; font-weight: 400; }

    /* ── Drop zone header ── */
    .drop-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 5px;
    }
    .drop-header .field-label { margin-bottom: 0; }
    #open-gif-btn {
      background: rgba(167,139,250,0.06);
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 6px; color: #6b60a0;
      font-size: 11px; cursor: pointer; padding: 3px 10px;
      transition: all 0.15s; -webkit-app-region: no-drag;
    }
    #open-gif-btn:hover { border-color: rgba(167,139,250,0.4); color: #c4b5fd; background: rgba(167,139,250,0.1); }

    /* ── Drop zone ── */
    #drop-zone {
      background: #1a1828; border: 1.5px dashed #28224a;
      border-radius: 10px; padding: 14px 12px;
      color: #35305a; font-size: 12px; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; min-height: 52px; cursor: default;
    }
    #drop-zone:hover { border-color: #3d3570; color: #5a5090; }
    #drop-zone.drag-over { border-color: #a78bfa; background: rgba(167,139,250,0.06); color: #a78bfa; }
    #drop-zone.has-url { border-style: solid; border-color: rgba(167,139,250,0.22); color: #c4b5fd; justify-content: flex-start; }
    .drop-icon { font-size: 16px; flex-shrink: 0; }
    #url-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
    #clear-url { background: none; border: none; color: #3a3560; cursor: pointer; font-size: 14px; flex-shrink: 0; transition: color 0.15s; }
    #clear-url:hover { color: #f87171; }

    /* ── URL paste ── */
    #url-paste {
      width: 100%; background: #0e0d18;
      border: 1px solid #1e1a30; border-radius: 7px;
      padding: 6px 12px; color: #5a5585;
      font-size: 11px; outline: none; margin-top: 6px;
      transition: border-color 0.15s, color 0.15s; font-family: inherit;
    }
    #url-paste:focus { border-color: rgba(167,139,250,0.35); color: #ccc; }
    #url-paste::placeholder { color: #26224a; }

    /* ── Loop row ── */
    #loop-row {
      display: flex; align-items: center; gap: 8px;
      background: #1a1828; border: 1.5px solid #221e38;
      border-radius: 8px; padding: 7px 12px;
      transition: opacity 0.2s;
    }
    #loop-row.disabled { opacity: 0.35; pointer-events: none; }
    #loop-row.loop-active { border-color: rgba(167,139,250,0.3); }
    #loop-chk {
      width: 14px; height: 14px; border-radius: 3px;
      border: 1.5px solid #3a3565; background: #12111a;
      flex-shrink: 0; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    #loop-chk.checked { background: #7c3aed; border-color: #7c3aed; color: #fff; font-size: 9px; }
    .loop-label { color: #5a5585; font-size: 11px; cursor: pointer; }
    #loop-hint { color: #3a3560; font-size: 10px; flex: 1; text-align: right; font-style: italic; }
    #loop-secs {
      background: #0e0d18; border: 1px solid #3a3565;
      border-radius: 5px; padding: 2px 6px; color: #c4b5fd;
      font-size: 11px; width: 36px; text-align: center;
      outline: none; font-family: inherit;
    }
    #loop-secs-label { color: #5a5585; font-size: 10px; }

    /* ── Divider ── */
    .section-divider { border: none; border-top: 1px solid #1e1c2e; }

    /* ── Size & Position section ── */
    .size-pos-row { display: flex; gap: 10px; align-items: flex-start; }

    /* Anchor grid */
    .anchor-grid {
      display: grid;
      grid-template-columns: repeat(3, 26px);
      grid-template-rows: repeat(3, 26px);
      gap: 3px;
      flex-shrink: 0;
    }
    .anchor-btn {
      width: 26px; height: 26px; border-radius: 6px;
      background: #1a1828; border: 1.5px solid #221e38;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; -webkit-app-region: no-drag;
    }
    .anchor-btn:hover { border-color: rgba(167,139,250,0.4); }
    .anchor-btn.active { background: rgba(167,139,250,0.15); border-color: #a78bfa; }
    .anchor-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #2a2550; transition: background 0.15s;
    }
    .anchor-btn.active .anchor-dot { background: #c4b5fd; }
    .anchor-blank { width: 26px; height: 26px; }

    /* Right stack */
    .right-stack { flex: 1; display: flex; flex-direction: column; gap: 6px; }

    /* Size chips */
    .size-chips { display: flex; gap: 5px; }
    .size-chip {
      flex: 1; padding: 5px 0; text-align: center;
      border-radius: 7px; border: 1.5px solid #221e38;
      background: #1a1828; color: #38346a;
      font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; -webkit-app-region: no-drag;
    }
    .size-chip:hover { border-color: rgba(167,139,250,0.35); color: #9080c8; }
    .size-chip.active { background: rgba(167,139,250,0.12); border-color: #a78bfa; color: #c4b5fd; }

    /* Target + caption */
    .target-row { display: flex; gap: 7px; align-items: center; }
    .field-input {
      width: 100%; background: #1a1828;
      border: 1.5px solid #221e38; border-radius: 8px;
      padding: 7px 10px; color: #e0e0e0; font-size: 12px;
      outline: none; transition: border-color 0.15s, background 0.15s;
      font-family: inherit;
    }
    .field-input:focus { border-color: rgba(167,139,250,0.45); background: #1e1c2e; }
    .field-input::placeholder { color: #2a2550; }
    select.field-input { cursor: pointer; }
    select.field-input option { background: #1a1828; }
    #refresh-btn {
      background: #1a1828; border: 1.5px solid #221e38; border-radius: 8px;
      color: #3a3565; font-size: 16px; cursor: pointer; padding: 5px 10px;
      transition: all 0.15s; flex-shrink: 0;
    }
    #refresh-btn:hover { border-color: rgba(167,139,250,0.45); color: #a78bfa; }
    @keyframes spinAnim { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #refresh-btn.spinning { animation: spinAnim 0.5s linear; }

    /* ── Two-column row (effects + voice) ── */
    .two-col { display: flex; gap: 12px; }
    .two-col > div { flex: 1; }

    /* ── Effects chips ── */
    #effects-row { display: flex; gap: 6px; }
    .chip {
      padding: 4px 12px; border-radius: 20px;
      border: 1.5px solid #221e38; background: #1a1828;
      color: #38346a; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
    }
    .chip:hover { border-color: rgba(167,139,250,0.35); color: #9080c8; }
    .chip.active { background: rgba(167,139,250,0.12); border-color: #a78bfa; color: #c4b5fd; }

    /* ── Mic ── */
    #mic-btn {
      background: #1a1828; border: 1.5px solid #221e38; border-radius: 8px;
      color: #5a5585; font-size: 11px; cursor: pointer; padding: 6px 12px;
      white-space: nowrap; transition: all 0.15s; font-family: inherit;
      display: block; width: 100%;
    }
    #mic-btn:hover { border-color: rgba(167,139,250,0.4); color: #aaa; }
    #mic-btn.recording { background: rgba(239,68,68,0.08); border-color: #ef4444; color: #ef4444; animation: recPulse 0.9s ease-in-out infinite; }
    #mic-btn.has-audio  { background: rgba(74,222,128,0.07); border-color: #4ade80; color: #4ade80; }
    @keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    #voice-label { font-size: 10px; color: #33305a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
    #voice-label.active { color: #4ade80; }

    /* ── Send button ── */
    #send-btn {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      color: #fff; border: none; border-radius: 10px;
      padding: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
      box-shadow: 0 4px 18px rgba(109,40,217,0.3); font-family: inherit;
    }
    #send-btn:hover {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      box-shadow: 0 6px 24px rgba(109,40,217,0.45);
      transform: translateY(-1px);
    }
    #send-btn:active { transform: translateY(0); }
    #send-btn:disabled { background: #1e1c30; color: #38346a; cursor: default; box-shadow: none; transform: none; }

    /* ── Status ── */
    #status { text-align: center; font-size: 11px; color: #35305a; min-height: 14px; }
    #status.ok  { color: #4ade80; }
    #status.err { color: #f87171; }

    /* ── GIF view ── */
    .gif-nav { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #gif-back-btn {
      background: #1a1828; border: 1.5px solid #221e38; border-radius: 8px;
      color: #6b60a0; font-size: 12px; cursor: pointer; padding: 6px 13px;
      transition: all 0.15s; font-family: inherit; flex-shrink: 0;
    }
    #gif-back-btn:hover { border-color: rgba(167,139,250,0.45); color: #c4b5fd; }
    #gif-search-input {
      width: 100%; flex-shrink: 0;
      background: #1a1828; border: 1.5px solid #221e38; border-radius: 8px;
      padding: 9px 12px; color: #e0e0e0; font-size: 13px; outline: none;
      transition: border-color 0.15s; font-family: inherit;
    }
    #gif-search-input:focus { border-color: rgba(167,139,250,0.45); }
    #gif-search-input::placeholder { color: #2a2550; }
    #gif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; overflow-y: auto; flex: 1; }
    .gif-item {
      aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s; background: #1a1828;
    }
    .gif-item:hover { border-color: #a78bfa; transform: scale(1.03); }
    .gif-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #gif-status { text-align: center; font-size: 12px; color: #35305a; padding: 30px 0; flex-shrink: 0; }

    /* ── History button ── */
    #open-history-btn {
      background: rgba(167,139,250,0.06);
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 6px; color: #6b60a0;
      font-size: 11px; cursor: pointer; padding: 3px 10px;
      transition: all 0.15s; -webkit-app-region: no-drag;
    }
    #open-history-btn:hover { border-color: rgba(167,139,250,0.4); color: #c4b5fd; background: rgba(167,139,250,0.1); }

    /* ── History view ── */
    #history-view {
      position: absolute; inset: 0;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      background: #12111a;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #history-view.slide-in { transform: translateX(0); }
    .history-nav {
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #history-back-btn {
      background: #1a1828; border: 1.5px solid #221e38; border-radius: 8px;
      color: #6b60a0; font-size: 12px; cursor: pointer; padding: 6px 13px;
      transition: all 0.15s; font-family: inherit; flex-shrink: 0;
    }
    #history-back-btn:hover { border-color: rgba(167,139,250,0.45); color: #c4b5fd; }
    #history-clear-btn {
      background: none; border: 1px solid #221e38; border-radius: 6px;
      color: #3a3565; font-size: 11px; cursor: pointer; padding: 3px 10px;
      transition: all 0.15s; font-family: inherit;
    }
    #history-clear-btn:hover { border-color: rgba(248,113,113,0.4); color: #f87171; }
    #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    #history-empty { text-align: center; font-size: 12px; color: #35305a; padding: 30px 0; flex-shrink: 0; }
    .history-entry {
      display: flex; align-items: center; gap: 10px;
      background: #1a1828; border: 1.5px solid #221e38;
      border-radius: 10px; padding: 8px 10px;
      transition: border-color 0.15s;
    }
    .history-entry:hover { border-color: rgba(167,139,250,0.25); }
    .history-thumb {
      width: 44px; height: 44px; border-radius: 7px; overflow: hidden;
      background: #12111a; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .history-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .history-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .history-caption { font-size: 12px; color: #c4b5fd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-caption.no-caption { color: #3a3565; font-style: italic; }
    .history-time { font-size: 10px; color: #35305a; }
    .history-resend {
      background: rgba(167,139,250,0.08); border: 1.5px solid rgba(167,139,250,0.2);
      border-radius: 7px; color: #7c6fc4; font-size: 11px;
      cursor: pointer; padding: 5px 10px; transition: all 0.15s;
      font-family: inherit; white-space: nowrap; flex-shrink: 0;
    }
    .history-resend:hover { border-color: #a78bfa; color: #c4b5fd; background: rgba(167,139,250,0.15); }
    .history-resend:disabled { opacity: 0.4; cursor: default; }

    /* ── Favorites modal ── */
    #fav-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72); align-items: center; justify-content: center;
      z-index: 99; backdrop-filter: blur(3px);
    }
    #fav-modal.open { display: flex; }
    #fav-modal-box {
      background: #1e1a2e; border: 1px solid #2d2855;
      border-radius: 12px; padding: 20px; width: 280px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    #fav-name-input {
      width: 100%; background: #12111a;
      border: 1.5px solid #221e38; border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 13px; outline: none; font-family: inherit;
    }
    #fav-name-input:focus { border-color: rgba(167,139,250,0.45); }
    #fav-modal-row { display: flex; gap: 8px; }
    #fav-save-ok {
      flex: 1; background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border: none; border-radius: 8px; color: #fff;
      padding: 9px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
    }
    #fav-save-ok:hover { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    #fav-save-cancel {
      flex: 1; background: #1a1828; border: 1.5px solid #221e38;
      border-radius: 8px; color: #5a5585; padding: 9px;
      cursor: pointer; font-size: 13px; font-family: inherit;
    }
    #fav-save-cancel:hover { color: #aaa; }
  </style>
</head>
<body>

  <div id="titlebar">
    <div class="title-left">
      <span class="title-text">🎭 MemeDrop</span>
      <span class="title-hint">Ctrl+Shift+D</span>
    </div>
    <button id="close-btn">✕</button>
  </div>

  <div id="main">

    <!-- ── Drop view ── -->
    <div id="drop-view">

      <!-- Media -->
      <div>
        <div class="drop-header">
          <div class="field-label">Media</div>
          <div style="display:flex;gap:6px">
            <button id="open-history-btn">🕐 History</button>
            <button id="open-gif-btn">🔍 Search GIFs</button>
          </div>
        </div>
        <div id="drop-zone">
          <span class="drop-icon">📎</span>
          <span id="url-text">Drop a file here, or paste a URL below</span>
          <button id="clear-url" style="display:none">✕</button>
        </div>
        <input id="url-paste" type="text" placeholder="https://… paste a link" />
      </div>

      <!-- Loop row -->
      <div id="loop-row" class="disabled">
        <div id="loop-chk"></div>
        <span class="loop-label" id="loop-label-text">Loop</span>
        <input id="loop-secs" type="number" value="10" min="1" max="300" style="display:none" />
        <span id="loop-secs-label" style="display:none">seconds</span>
        <span id="loop-hint">load a video first</span>
      </div>

      <hr class="section-divider" />

      <!-- Size & Position -->
      <div>
        <div class="field-label">Size &amp; Position</div>
        <div class="size-pos-row">

          <!-- Anchor grid: TL blank TR / blank C blank / BL blank BR -->
          <div class="anchor-grid">
            <button class="anchor-btn" data-anchor="top-left"><div class="anchor-dot"></div></button>
            <div class="anchor-blank"></div>
            <button class="anchor-btn" data-anchor="top-right"><div class="anchor-dot"></div></button>
            <div class="anchor-blank"></div>
            <button class="anchor-btn" data-anchor="center"><div class="anchor-dot"></div></button>
            <div class="anchor-blank"></div>
            <button class="anchor-btn" data-anchor="bottom-left"><div class="anchor-dot"></div></button>
            <div class="anchor-blank"></div>
            <button class="anchor-btn" data-anchor="bottom-right"><div class="anchor-dot"></div></button>
          </div>

          <!-- Right: size chips + target + caption -->
          <div class="right-stack">
            <div class="size-chips">
              <button class="size-chip" data-size="s">S</button>
              <button class="size-chip active" data-size="m">M</button>
              <button class="size-chip" data-size="l">L</button>
              <button class="size-chip" data-size="xl">XL</button>
            </div>
            <div class="target-row">
              <select id="target" class="field-input"><option value="">Everyone</option></select>
              <button id="refresh-btn" title="Refresh">↻</button>
            </div>
            <input id="caption" type="text" class="field-input" placeholder="Caption…" />
          </div>

        </div>
      </div>

      <hr class="section-divider" />

      <!-- Effects + Voice -->
      <div class="two-col">
        <div>
          <div class="field-label">Effects</div>
          <div id="effects-row">
            <div class="chip" data-fx="spin">✦ spin</div>
            <div class="chip" data-fx="fade">◌ fade</div>
          </div>
        </div>
        <div>
          <div class="field-label">Voice <span class="opt">— optional</span></div>
          <button id="mic-btn">🎤 Record</button>
          <div id="voice-label">No recording</div>
        </div>
      </div>

      <button id="send-btn">🚀 Send Drop</button>
      <div id="status"></div>

    </div>

    <!-- ── History view (slides in) ── -->
    <div id="history-view">
      <div class="history-nav">
        <button id="history-back-btn">← Back</button>
        <div class="field-label" style="margin:0">Drop History</div>
        <button id="history-clear-btn">Clear</button>
      </div>
      <div id="history-list"></div>
      <div id="history-empty">No drops received yet</div>
    </div>

    <!-- ── GIF search view (slides in) ── -->
    <div id="gif-view">
      <div class="gif-nav">
        <button id="gif-back-btn">← Back</button>
        <div class="field-label" style="margin:0">GIF Search</div>
      </div>
      <input id="gif-search-input" type="text" placeholder="Search GIFs — fail, win, haha…" />
      <div id="gif-grid"></div>
      <div id="gif-status">Type something to search</div>
    </div>

  </div>

  <!-- Save favorite modal -->
  <div id="fav-modal">
    <div id="fav-modal-box">
